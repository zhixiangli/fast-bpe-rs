name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-distributions:
    name: Build ${{ matrix.name }}
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wheel (ubuntu-latest)
            os: ubuntu-latest
            artifact_name: wheels-ubuntu-latest
            command: build
            args: --release --strip --out dist
          - name: wheel (macos-latest)
            os: macos-latest
            artifact_name: wheels-macos-latest
            command: build
            args: --release --strip --out dist
          - name: wheel (windows-latest)
            os: windows-latest
            artifact_name: wheels-windows-latest
            command: build
            args: --release --strip --out dist
          - name: sdist
            os: ubuntu-latest
            artifact_name: sdist
            command: sdist
            args: --out dist
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Build distribution
        uses: PyO3/maturin-action@v1
        with:
          command: ${{ matrix.command }}
          args: ${{ matrix.args }}

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist

  publish:
    name: Publish to PyPI
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build-distributions
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/fast-bpe-rs
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish GitHub release artifacts
        run: gh release upload "$TAG_NAME" dist/* --clobber
