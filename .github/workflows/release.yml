name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Re-release a specific tag (e.g., v0.1.2). Used to retry failed releases."
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Draft the release until artifacts are ready
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(gh api "repos/$GH_REPO/releases/tags/${{ steps.release.outputs.tag_name }}" --jq '.immutable')" = "true" ]; then
            echo "Release ${{ steps.release.outputs.tag_name }} is immutable; skipping draft edit."
            exit 0
          fi

          gh release edit "${{ steps.release.outputs.tag_name }}" --draft

  build-distributions:
    name: Build ${{ matrix.name }}
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wheel (ubuntu-latest)
            os: ubuntu-latest
            artifact_name: wheels-ubuntu-latest
            command: build
            args: --release --strip --out dist
          - name: wheel (macos-latest)
            os: macos-latest
            artifact_name: wheels-macos-latest
            command: build
            args: --release --strip --out dist
          - name: wheel (windows-latest)
            os: windows-latest
            artifact_name: wheels-windows-latest
            command: build
            args: --release --strip --out dist
          - name: sdist
            os: ubuntu-latest
            artifact_name: sdist
            command: sdist
            args: --out dist
    env:
      RELEASE_REF: ${{ needs.release-please.outputs.sha || inputs.tag_name }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Build distribution
        uses: PyO3/maturin-action@v1
        with:
          command: ${{ matrix.command }}
          args: ${{ matrix.args }}

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist

  publish:
    name: Publish to PyPI
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build-distributions
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/fast-bpe-rs
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish GitHub release artifacts
        run: |
          if [ "$(gh api "repos/$GH_REPO/releases/tags/$TAG_NAME" --jq '.immutable')" = "true" ]; then
            echo "Release $TAG_NAME is immutable; skipping GitHub release asset upload."
            exit 0
          fi

          gh release edit "$TAG_NAME" --draft=true
          gh release upload "$TAG_NAME" dist/* --clobber
          gh release edit "$TAG_NAME" --draft=false
