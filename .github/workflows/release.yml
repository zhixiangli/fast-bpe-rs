name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Re-release a specific tag (e.g., v0.1.2). Used to retry failed releases."
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-wheels:
    name: Build wheel (${{ matrix.os }})
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha || inputs.tag_name }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  build-sdist:
    name: Build sdist
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: release-please

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha || inputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        run: |
          uv tool install maturin
          maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs:
      - release-please
      - build-wheels
      - build-sdist
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/fast-bpe-rs

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Ensure release is draft (mutable) before uploading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=true

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false
