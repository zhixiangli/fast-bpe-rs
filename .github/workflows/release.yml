name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump version and tag release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bump patch version
        id: bump
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          cargo_toml = Path("Cargo.toml")
          cargo_lock = Path("Cargo.lock")

          cargo_text = cargo_toml.read_text()
          package_version = re.search(
              r'(?sm)(^\[package\]\n.*?^version = ")(\d+)\.(\d+)\.(\d+)("$)',
              cargo_text,
          )
          if not package_version:
              raise SystemExit("Could not find package version in Cargo.toml")

          major, minor, patch = map(int, package_version.groups()[1:4])
          new_version = f"{major}.{minor}.{patch + 1}"
          cargo_text = (
              cargo_text[: package_version.start(2)]
              + new_version
              + cargo_text[package_version.end(4):]
          )
          cargo_toml.write_text(cargo_text)

          lock_text = cargo_lock.read_text()
          lock_version = re.search(
              r'(?sm)(\[\[package\]\]\nname = "fast-bpe-rs"\nversion = ")(\d+\.\d+\.\d+)(")',
              lock_text,
          )
          if not lock_version:
              raise SystemExit("Could not find fast-bpe-rs package version in Cargo.lock")

          lock_text = (
              lock_text[: lock_version.start(2)]
              + new_version
              + lock_text[lock_version.end(2):]
          )
          cargo_lock.write_text(lock_text)

          github_output = Path(__import__("os").environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              fh.write(f"version={new_version}\n")
              fh.write(f"tag=v{new_version}\n")
          PY

      - name: Commit version bump and push tag
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main --follow-tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-wheels:
    name: Build wheel (${{ matrix.os }})
    if: github.event.pull_request.merged == true
    runs-on: ${{ matrix.os }}
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  build-sdist:
    name: Build sdist
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: bump-version

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        run: |
          uv tool install maturin
          maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs:
      - bump-version
      - build-wheels
      - build-sdist
    environment:
      name: pypi
      url: https://pypi.org/p/fast-bpe-rs

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
