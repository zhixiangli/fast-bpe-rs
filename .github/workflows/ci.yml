name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Python imports and style
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-features

      - name: Install extension module for Python tests
        run: uv run maturin develop --release

      - name: Run Python tests
        run: uv run pytest

      - name: Build source and wheel distributions
        run: uv run maturin build --release --strip --sdist --out dist

      - name: Validate distribution metadata
        run: uv run twine check dist/*

      - name: Smoke test wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from fast_bpe_rs import BPE; bpe = BPE(r'(?s).+'); bpe.train(257, ['banana']); assert bpe.decode_to_string(bpe.encode('banana')) == 'banana'"
