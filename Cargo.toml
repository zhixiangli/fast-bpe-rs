[package]
name = "fast-bpe-rs"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Fast Byte Pair Encoding (BPE) tokenizer with Python bindings powered by PyO3."
readme = "README.md"
license = "Apache-2.0"
keywords = ["bpe", "tokenizer", "python", "pyo3", "nlp"]
categories = ["algorithms", "text-processing"]

[lib]
name = "fast_bpe_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
rayon = "1.11.0"
regex = "1.12.2"
fancy-regex = "0.14.0"
pyo3 = { version = "0.28.2", features = ["abi3-py310"] }
hf-hub = "0.5.0"
parquet = "58.1.0"
ahash = "0.8.12"
rustc-hash = "2.1.1"
smallvec = "1.15.1"
stats_alloc = "0.1.10"
