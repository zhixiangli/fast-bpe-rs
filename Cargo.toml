[package]
name = "fast-bpe-rs"
version = "0.4.2"
edition = "2024"
rust-version = "1.85"
description = "Fast Byte Pair Encoding (BPE) tokenizer with Python bindings powered by PyO3."
readme = "README.md"
license = "Apache-2.0"
keywords = ["bpe", "tokenizer", "python", "pyo3", "nlp"]
categories = ["algorithms", "text-processing"]

[lib]
name = "fast_bpe_rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
rayon = "1.11.0"
fancy-regex = "0.17.0"
pyo3 = { version = "0.28.3", features = ["abi3-py310"] }
hashbrown = "0.16.0"
rustc-hash = "2.1.2"
log = "0.4.29"
pyo3-log = "0.13.3"

[profile.release]
lto = "fat"
codegen-units = 1
