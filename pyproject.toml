[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fast-bpe-rs"
dynamic = ["version"]
description = "Fast Byte Pair Encoding (BPE) tokenizer with Python bindings powered by PyO3."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fast-bpe-rs contributors" }]
keywords = ["bpe", "nlp", "pyo3", "rust", "tokenizer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "datasets>=4.1",
  "distro>=1.9",
  "memory-profiler>=0.61",
  "maturin>=1.7,<2.0",
  "pre-commit>=4.2",
  "psutil>=7.0",
  "py-cpuinfo>=9.0",
  "pytest>=8.3",
  "rustbpe>=0.1.0",
  "ruff>=0.11.13",
  "tiktoken>=0.12",
  "twine>=6.1",
]

[tool.maturin]
module-name = "fast_bpe_rs"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
sdist-generator = "git"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
